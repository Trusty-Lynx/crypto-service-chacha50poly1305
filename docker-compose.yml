name: crypto-service-chacha50poly1305

# Keine ports: Nur der Vault-Service im Netz trustylynx-net soll den Service erreichen.
services:
  app:
    build: .
    container_name: crypto-service-chacha50poly1305
    restart: unless-stopped
    env_file: .env
    networks:
      - default

networks:
  default:
    name: trustylynx-net
    external: true
